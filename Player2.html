<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Optimizado</title>
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="player"></div>

<script>
    // Obtener el parámetro var1 de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const playbackURL = urlParams.get('var1');

    if (playbackURL) {
        var player = new Clappr.Player({
            source: playbackURL,
            parentId: "#player",
            width: '100%',
            height: '100%',
            autoPlay: true,
            preload: 'auto',
            mute: false,
            // Configuración avanzada para mejorar el buffer
            playback: {
                hlsjsConfig: {
                    maxBufferLength: 30,         // Máximo de segundos de video en buffer
                    maxMaxBufferLength: 60,
                    initialLiveManifestSize: 3,  // Fragmentos mínimos para iniciar
                    maxBufferSize: 60 * 1024 * 1024, // 60MB de buffer en RAM
                    enableWorker: true,          // Usa hilos secundarios para procesar
                    lowLatencyMode: true,        // Reduce el retraso en vivo
                }
            },
            mediacontrol: { seekbar: "#D4ED31", buttons: "#FFFFFF" },
        });
    } else {
        document.getElementById('player').innerHTML = '<p style="color:white; text-align:center; margin-top:20%;">Error: No se proporcionó enlace (var1)</p>';
    }
</script>
</body>
</html>
