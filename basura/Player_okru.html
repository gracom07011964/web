<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK.RU Android TV</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

iframe {
  width: 100vw;
  height: 100vh;
  border: 0;
}
</style>
</head>

<body>

<iframe id="player"
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>

<script>
function obtenerParametro(nombre) {
  return new URLSearchParams(window.location.search).get(nombre);
}

document.addEventListener('DOMContentLoaded', () => {
  const iframe = document.getElementById('player');
  let url = obtenerParametro('star');

  if (!url) {
    document.body.innerHTML =
      '<h2 style="color:white;text-align:center;margin-top:30%;">Falta parámetro ?star=</h2>';
    return;
  }

  // Convertir URL normal de OK.RU a embebida
  if (!url.includes('/videoembed/')) {
    const id = url.split('/').pop();
    url = `https://ok.ru/videoembed/${id}?autoplay=1`;
  }

  iframe.src = url;

  // Forzar fullscreen (Android TV)
  setTimeout(() => {
    const fs =
      iframe.requestFullscreen ||
      iframe.webkitRequestFullscreen ||
      iframe.mozRequestFullScreen ||
      iframe.msRequestFullscreen;

    if (fs) fs.call(iframe);
  }, 1000);

  // ENTER del control remoto
  document.addEventListener('keydown', e => {
    if (e.key === "Enter") {
      iframe.src = iframe.src; // recarga y reproduce
    }
  });
});
</script>

</body>
</html>
