<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK.RU Android TV</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

#container {
  width: 100vw;
  height: 100vh;
  position: relative;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* Botón invisible que recibe ENTER */
#playBtn {
  position: absolute;
  inset: 0;
  background: transparent;
  border: none;
  outline: none;
}
</style>
</head>

<body>

<div id="container">
  <iframe id="player"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>

  <!-- Botón invisible -->
  <button id="playBtn"></button>
</div>

<script>
function obtenerParametro(nombre) {
  return new URLSearchParams(window.location.search).get(nombre);
}

document.addEventListener('DOMContentLoaded', () => {
  const iframe = document.getElementById('player');
  const playBtn = document.getElementById('playBtn');

  let url = obtenerParametro('star');

  if (!url) {
    document.body.innerHTML =
      '<h2 style="color:white;text-align:center;margin-top:30%;">Falta ?star=</h2>';
    return;
  }

  // Convertir a embed OK.RU
  if (!url.includes('videoembed')) {
    const id = url.split('/').pop();
    url = `https://ok.ru/videoembed/${id}`;
  }

  iframe.src = url;

  // Foco automático (clave para Android TV)
  playBtn.focus();

  // ENTER = gesto real
  playBtn.addEventListener('click', () => {
    iframe.src = iframe.src; // recarga ? reproduce
  });

  // ENTER del control remoto
  document.addEventListener('keydown', e => {
    if (e.key === "Enter") {
      playBtn.click();
    }
  });
});
</script>

</body>
</html>
