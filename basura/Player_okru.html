<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK.RU Android TV</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  color: white;
  font-family: Arial, sans-serif;
}

#screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

iframe {
  width: 100vw;
  height: 100vh;
  border: 0;
}
</style>
</head>

<body>

<div id="screen">
  ▶ Presiona ENTER para reproducir
</div>

<script>
function obtenerParametro(nombre) {
  return new URLSearchParams(window.location.search).get(nombre);
}

const urlOriginal = obtenerParametro('star');
const screen = document.getElementById('screen');

if (!urlOriginal) {
  screen.innerText = 'Falta parámetro ?star=';
}

function crearIframe() {
  let url = urlOriginal;

  // convertir a embed
  if (!url.includes('videoembed')) {
    const id = url.split('/').pop();
    url = `https://ok.ru/videoembed/${id}`;
  }

  screen.remove();

  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.allow = 'autoplay; fullscreen';
  iframe.allowFullscreen = true;

  document.body.appendChild(iframe);
}

// ENTER REAL del control remoto
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    crearIframe();
  }
});
</script>

</body>
</html>
