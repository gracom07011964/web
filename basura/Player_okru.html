<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video OK.ru</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
  }
  iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    background: black;
  }
  #btnFull {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid white;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<iframe 
  id="videoFrame"
  src="https://ok.ru/videoembed/5248148703767?autoplay=1" 
  allow="autoplay; fullscreen" 
  allowfullscreen>
</iframe>

<button id="btnFull">Pantalla completa</button>

<script>
  const iframe = document.getElementById('videoFrame');
  const boton = document.getElementById('btnFull');

  boton.onclick = () => {
    const reqFull = iframe.requestFullscreen || iframe.webkitRequestFullscreen;
    if (reqFull) reqFull.call(iframe);
  };

  // Intentar autoplay en móviles
  window.addEventListener('load', () => {
    iframe.src += '&muted=1'; // permite autoplay en móviles
  });
</script>

</body>
</html>
