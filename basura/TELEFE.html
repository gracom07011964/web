<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG-Player - Streaming</title>
    <!-- Cargamos la librería Hls.js desde CDN -->
    <script src="cdn.jsdelivr.net"></script>
    <style>
        body { background: black; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        video { width: 100%; max-width: 800px; border: 2px solid #333; }
    </style>
</head>
<body>

    <video id="video" controls autoplay playsinline></video>

    <script>
        const video = document.getElementById('video');
        const videoSrc = "https://live.saohgdasregions.fun/Y6gMx4s18]WB.php?stream=83&f=.ts";

        // 1. Lógica de Reproducción
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Soporte nativo para Safari/iOS
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', () => video.play());
        }

        // 2. Control del botón "Atrás" (Tu lógica original mejorada)
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function () {
            window.location.href = "go:ARGE123";
        };
    </script>
</body>
</html>
