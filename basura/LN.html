<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Live YouTube</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>

<div class="container">
    <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="M_gUd2Bp9g0"></div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const player = new Plyr('#player', {
            autoplay: true,
            muted: false,
            // Configuraciones críticas para evitar bloqueos
            youtube: {
                noCookie: false, // Cambiar a true si el error persiste
                rel: 0,
                showinfo: 0,
                iv_load_policy: 3,
                modestbranding: 1
            }
        });

        // Manejo de errores para depurar si salta el bot
        player.on('error', (event) => {
            console.error('Error en el reproductor:', event);
            alert('Si ves el mensaje de bot, intenta iniciar sesión en Google en otra pestaña.');
        });
    });
</script>

</body>
</html>
