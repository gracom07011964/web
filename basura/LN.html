<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Ajuste específico para el reproductor Plyr */
        .plyr {
            height: 100% !important;
            width: 100% !important;
        }
    </style>
</head>
<body>

<div class="video-container">
    <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="M_gUd2Bp9g0"></div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
    const player = new Plyr('#player', {
        fullscreen: { enabled: true, fallback: true, iosNative: true },
        autoplay: true,
        ratio: '16:9' // Ajusta esto si tu video tiene otro formato
    });

    // Forzar pantalla completa al estar listo
    player.on('ready', (event) => {
        // Un pequeño delay ayuda a que el WebView se asiente antes de expandir
        setTimeout(() => {
            player.fullscreen.enter();
        }, 500);
    });
</script>
</body>
</html>
