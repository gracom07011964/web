<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LN+ Smart TV Fix</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100vw; height: 100vh; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 100;
      display: flex; justify-content: center; align-items: center;
    }
    .btn-tv {
      padding: 30px 60px; font-size: 1.5rem; color: white;
      border: 4px solid #fff; background: transparent; cursor: pointer;
    }
    .btn-tv:focus { background: white; color: black; transform: scale(1.1); }
  </style>
</head>
<body>

  <div id="overlay">
    <button id="start-btn" class="btn-tv" autofocus onclick="startVideo()">INICIAR LN+ EN VIVO</button>
  </div>

  <div id="player"></div>

  <script>
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'M_gUd2Bp9g0',
        host: 'https://www.youtube-nocookie.com', // Versión con menos restricciones de cookies
        playerVars: { 
          'autoplay': 1, 
          'controls': 1, 
          'rel': 0, 
          'enablejsapi': 1,
          'origin': window.location.origin, // Crucial para validar el origen
          'widget_referrer': window.location.href
        },
        events: {
          'onReady': onPlayerReady,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      console.log("Jugador listo");
    }

    function onPlayerError(event) {
      // Si el error es 150 o 100, es que el video está bloqueado en aplicaciones externas
      alert("Error de reproducción. YouTube bloqueó el acceso. Intenta recargar.");
    }

    function startVideo() {
      document.getElementById('overlay').style.display = 'none';
      if (player && player.playVideo) {
          player.playVideo();
          player.unMute();
      }
    }

    window.onload = () => { document.getElementById('start-btn').focus(); };
  </script>
</body>
</html>
