<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DG-Player | Reproduciendo canal...</title>
  <style>
    body {
      background-color: black;
      color: white;
      text-align: center;
      padding-top: 80px;
      font-family: Arial, sans-serif;
    }
    .loading {
      font-size: 20px;
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <h2 id="titulo">🎬 Cargando canal...</h2>
  <p class="loading" id="mensaje">Por favor espera unos segundos...</p>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const canal = params.get("star") || "";
      if (!canal) {
        document.body.innerHTML = "<h2>⚠️ Debes indicar un canal con ?star=NombreDelCanal</h2>";
        return;
      }

      document.getElementById("titulo").textContent = `🎥 Buscando canal "${canal}"...`;

      // Usa proxy para evitar bloqueo CORS
      const proxy = "https://cors-proxy.fr/";
      const m3uUrl = proxy + "https://live.saohgdasregions.fun/regionales.m3u";

      try {
        const response = await fetch(m3uUrl);
        if (!response.ok) throw new Error("No se pudo cargar el archivo M3U.");
        const text = await response.text();

        // Buscar la URL del canal
        const regex = new RegExp(`#EXTINF:[^\\n]*${canal}[^\\n]*\\n([^\\n]+)`, "i");
        const match = text.match(regex);

        if (match && match[1]) {
          const streamUrl = match[1].trim();

          // Mostrar mensaje antes de redirigir
          document.getElementById("mensaje").textContent = "🔁 Redirigiendo al stream...";
          setTimeout(() => {
            window.location.href = streamUrl; // redirige como tu script original
          }, 1000);
        } else {
          document.body.innerHTML = `<h2>❌ No se encontró el canal "${canal}" en la lista.</h2>`;
        }
      } catch (error) {
        document.body.innerHTML = `<h2>🚫 Error al cargar el canal.</h2><p>${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
