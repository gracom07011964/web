<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor TV</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .main-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ESCUDO PARA CONTROL REMOTO */
    /* Se asegura de capturar el foco del botón "OK" del control */
    #escudo-clics {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.01); 
      z-index: 2147483647;
      outline: none; /* Elimina el borde de enfoque en TV */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2147483646;
      transition: opacity 0.5s;
    }

    /* Spinner más visible para TV */
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #222;
      border-top: 6px solid #3d5afe;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loader"><div class="spinner"></div></div>

  <div class="main-container">
    <div id="escudo-clics" tabindex="1"></div>

    <iframe 
      id="visor"
      sandbox="allow-same-origin allow-scripts allow-forms allow-presentation"
      referrerpolicy="no-referrer"
      allow="autoplay; fullscreen"
      src="">
    </iframe>
  </div>

  <script>
    const visor = document.getElementById('visor');
    const escudo = document.getElementById('escudo-clics');
    const loader = document.getElementById('loader');

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    // Forzar el foco en el escudo al cargar para que el primer "OK" sea capturado
    window.onload = () => {
      escudo.focus();
    };

    // Bloqueo de ventanas emergentes
    window.open = () => null;

    // Función para limpiar el escudo (para Clic o Botón OK del control)
    function desbloquear() {
      console.log("TV: Desbloqueando protector...");
      escudo.style.pointerEvents = 'none';
      setTimeout(() => {
        escudo.remove();
        // Intentar dar foco al iframe para que el control remoto controle el video
        visor.focus();
      }, 400);
    }

    escudo.addEventListener('click', desbloquear);
    
    // Soporte específico para teclas de control remoto (Enter / OK)
    escudo.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13) {
        desbloquear();
      }
    });

    const url = getParam('star');
    if (url && url.startsWith('http')) {
      visor.src = url;

      visor.onload = () => {
        loader.classList.add('hidden');

        // Limpieza de capas (Si el sitio permite inyección)
        try {
          const styleTag = document.createElement('style');
          styleTag.innerHTML = `
            div[class*="overlay"], div[class*="popup"], 
            div[style*="z-index: 9999"], div[style*="z-index: 2147483647"],
            .ad-container, img[src*="banner"] {
              display: none !important;
              visibility: hidden !important;
              height: 0px !important;
            }
          `;
          visor.contentDocument.head.appendChild(styleTag);
        } catch (e) {
          console.log("Protección Sandbox activa para TV.");
        }
      };
    } else {
      loader.innerHTML = "<div style='color:white;'>Inserte URL en ?star=</div>";
    }
  </script>
</body>
</html>
