<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor Seguro Antipopups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101010;
      color: #f0f0f0;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      background: #1976d2;
      padding: 15px;
      margin: 0;
      font-size: 20px;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: black;
      border-radius: 8px;
      margin-top: 10px;
      background: #000;
    }

    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    footer {
      font-size: 13px;
      color: #aaa;
      margin-top: 10px;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="loader"> Espere un momento…. </div>

  <iframe 
    id="visor"
    sandbox="allow-same-origin allow-scripts"
    referrerpolicy="no-referrer"
    src="">
  </iframe>

  <footer>  </footer>

  <script>
    // ?? Obtener parámetros de la URL
    function getParameter(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // ?? Bloqueo avanzado de popups y redirecciones
    (function protegerVentanas() {
      window.open = function() {
        console.warn("?? Popup bloqueado (window.open interceptado)");
        return null;
      };

      const bloquearRedirecciones = function() {
        console.warn("?? Redirección bloqueada.");
      };
      window.location.assign = bloquearRedirecciones;
      window.location.replace = bloquearRedirecciones;

      document.addEventListener('click', function(e) {
        const t = e.target.tagName.toLowerCase();
        if (t === 'a' && e.target.target === '_blank') {
          e.preventDefault();
          console.warn("?? Enlace externo bloqueado.");
        }
      }, true);

      try {
        Object.defineProperty(window.top, 'location', {
          configurable: false,
          enumerable: true,
          writable: false,
          value: window.top.location
        });
      } catch (e) {
        console.warn("?? Protección top.location aplicada.");
      }
    })();

    // ?? Carga automática del enlace pasado en ?star=
    const urlParam = getParameter('star');
    const visor = document.getElementById('visor');
    const loader = document.getElementById('loader');

    if (urlParam && urlParam.startsWith('http')) {
      loader.classList.remove('hidden'); // muestra mensaje
      visor.src = urlParam;
      console.log("?? Reproduciendo:", urlParam);

      // Oculta el mensaje cuando carga la página
      visor.addEventListener('load', () => {
        setTimeout(() => {
          loader.classList.add('hidden');
        }, 500); // ligera demora para suavizar transición
      });
    } else {
      loader.textContent = "?? No se detectó una URL válida. Use ?star=https://...";
      setTimeout(() => loader.classList.add('hidden'), 4000);
      console.log("?? No se detectó una URL válida. Esperando parámetro ?star=");
    }
  </script>
</body>
</html>
